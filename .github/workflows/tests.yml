name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m erp_support --products samples/products.csv --movements samples/movements.csv --out reports/clean.json
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-report
          path: reports/clean.json
